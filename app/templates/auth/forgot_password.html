{% extends "base.html" %}

{% block title %}Reset Password - Dr. Girija's NutriLife{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-extrabold text-gray-900">Reset Your Password</h2>
            <p class="text-sm text-gray-500 mt-1">Enter your registered email and choose a new password</p>
        </div>

        <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">Registered Email Address</label>
                <input type="email" name="email" required placeholder="you@example.com" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-emerald-500 text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">New Password (Min 6 chars)</label>
                <input type="password" name="new_password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-emerald-500 text-sm">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">Confirm New Password</label>
                <input type="password" name="confirm_new_password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-emerald-500 text-sm">
            </div>

            <button type="submit" class="w-full py-3 px-4 bg-emerald-700 hover:bg-emerald-800 text-white font-bold rounded-xl shadow-md transition">
                Reset Password
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="{{ url_for('auth.login') }}" class="text-xs font-semibold text-emerald-700 hover:underline">Back to Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
