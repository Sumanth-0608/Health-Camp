{% extends "base.html" %}

{% block title %}Sign In - 90-Day Wellness Tracker{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl border border-gray-100">
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-xl bg-emerald-700 text-white flex items-center justify-center mx-auto mb-3 shadow-md">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
            </div>
            <h2 class="text-2xl font-extrabold text-gray-900">Sign In to Your Tracker</h2>
            <p class="text-sm text-gray-500 mt-1">Enter your credentials to continue your 90-day progress</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}" class="space-y-5">
            <div>
                <label for="email" class="block text-xs font-bold uppercase tracking-wider text-gray-700 mb-1">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="you@example.com" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label for="password" class="block text-xs font-bold uppercase tracking-wider text-gray-700">Password</label>
                    <a href="{{ url_for('auth.forgot_password') }}" class="text-xs font-semibold text-emerald-700 hover:underline">Forgot password?</a>
                </div>
                <input type="password" id="password" name="password" required placeholder="••••••••" class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm">
            </div>

            <div class="flex items-center">
                <input type="checkbox" id="remember" name="remember" class="w-4 h-4 text-emerald-600 rounded border-gray-300 focus:ring-emerald-500">
                <label for="remember" class="ml-2 text-xs font-medium text-gray-600">Keep me signed in</label>
            </div>

            <button type="submit" class="w-full py-3 px-4 bg-emerald-700 hover:bg-emerald-800 text-white font-bold rounded-xl shadow-md hover:shadow-lg transition">
                Sign In
            </button>
        </form>

        <div class="mt-8 pt-6 border-t border-gray-100 text-center">
            <p class="text-sm text-gray-600">
                Not registered yet?
                <a href="{{ url_for('auth.register') }}" class="font-bold text-emerald-700 hover:text-emerald-800 ml-1">Create an account</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
